name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test Theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "release"

      - name: Install Posit ir
        run: |
          curl -fsSL https://raw.githubusercontent.com/r-lib/ir/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Render Book with ir
        run: |
          ir render --with gt,reactable,plotly,ggplot2 .

      - name: Run Theme Invariant Assertions with testthat
        run: |
          ir run tests/test-theme.R

      - name: Upload Rendered Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-showcase-preview
          path: _book/
