title: Nghiaagent Quarto Theme
name: nghiaagent-quarto-theme
author: Nghia Nguyen (Mitchell)
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    html:
      theme:
        light:
          - flatly
          - nghiaagent-quarto-theme.scss
        dark:
          - darkly
          - nghiaagent-quarto-theme.scss
      respect-user-color-scheme: true
      monofont: "JetBrains Mono"
      code-fold: true
    nghiaagent-quarto-theme-html:
      theme:
        light:
          - flatly
          - nghiaagent-quarto-theme.scss
        dark:
          - darkly
          - nghiaagent-quarto-theme.scss
      respect-user-color-scheme: true
      monofont: "JetBrains Mono"
      code-fold: true
