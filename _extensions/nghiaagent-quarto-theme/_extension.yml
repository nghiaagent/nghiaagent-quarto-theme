title: Nghiaagent Quarto Theme
name: nghiaagent-quarto-theme
author: Nghia Nguyen (Mitchell)
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  # For projects that list the theme scss themselves: `filters: [nghiaagent-quarto-theme]`
  filters:
    - path: inline-svg.lua
      at: post-render
  formats:
    html:
      theme:
        light:
          - flatly
          - nghiaagent-quarto-theme.scss
        dark:
          - darkly
          - nghiaagent-quarto-theme.scss
      respect-user-color-scheme: true
      monofont: "JetBrains Mono"
      code-fold: true
      filters:
        - path: inline-svg.lua
          at: post-render
    nghiaagent-quarto-theme-html:
      theme:
        light:
          - flatly
          - nghiaagent-quarto-theme.scss
        dark:
          - darkly
          - nghiaagent-quarto-theme.scss
      respect-user-color-scheme: true
      monofont: "JetBrains Mono"
      code-fold: true
      filters:
        - path: inline-svg.lua
          at: post-render
